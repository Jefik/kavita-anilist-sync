services:
  kavita-anilist-sync:
    build: .
    container_name: kavita-anilist-sync
    user: "1000:1000"
    environment:
      - KAVITA_URL=http://host.docker.internal:5000
      - ALLOWED_HOSTS=kavita.example.com
      - CORS_ORIGINS=
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
